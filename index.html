<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinterest</title>
  <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: sans-serif;
}

body {
    background-color: #fff;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid #efefef;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #e60023;
    text-decoration: none;
    background-color: #efefef;
    padding: 5px 10px;
    border-radius: 50%;
}

.search-bar {
    flex-grow: 1;
    max-width: 800px;
    min-width: 400px;
}

.search-bar input {
    width: 100%;
    padding: 10px 15px;
    border: none;
    border-radius: 25px;
    background-color: #efefef;
    font-size: 16px;
}

.nav-icons a {
    text-decoration: none;
    color: #111;
    font-size: 20px;
    padding: 8px;
    margin-left: 5px;
    border-radius: 50%;
    background-color: #efefef;
}

.header-right {
    display: flex;
    align-items: center;
}

/* Стилизация навигационного блока (теперь div) */
.categories {
    display: flex;
    justify-content: center;
    padding: 10px 0;
    gap: 15px;
    overflow-x: auto;
}

.categories a {
    text-decoration: none;
    color: #111;
    padding: 8px 12px;
    border-radius: 20px;
    font-weight: 500;
    transition: background-color 0.2s;
    white-space: nowrap;
}

.categories a:hover {
    background-color: #eee;
}

.categories .active {
    background-color: #111;
    color: #fff;
}

.main-content-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    padding: 10px;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
}

.pin-column {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.pin {
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    cursor: zoom-in;
    position: relative;
    transition: transform 0.3s ease;
}

.pin img {
    width: 100%;
    height: auto;
    display: block;
}
   </style>
</head>
